<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Git Logs hero</title>
    <style>
      :root {
        --bg: #eef2f7;
        --ink: #17263c;
        --accent: #2f6fd1;
        --muted: #5a6b82;
        --soft: #8aa0bd;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1600px;
        height: 1000px;
        overflow: hidden;
      }
      body {
        position: relative;
        background:
          radial-gradient(
            1100px 700px at 78% 40%,
            rgba(113, 158, 234, 0.18),
            transparent 70%
          ),
          radial-gradient(
            700px 500px at 8% 100%,
            rgba(66, 184, 162, 0.14),
            transparent 70%
          ),
          var(--bg);
        color: var(--ink);
        font-family:
          -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif;
      }
      .eyebrow {
        position: absolute;
        left: 90px;
        top: 90px;
        font-size: 15px;
        letter-spacing: 0.28em;
        text-transform: uppercase;
        color: var(--soft);
      }
      .copy {
        position: absolute;
        left: 78px;
        top: 212px;
        width: 480px;
      }
      .icon {
        width: 92px;
        height: 92px;
        border-radius: 22px;
        box-shadow: 0 10px 24px rgba(23, 38, 60, 0.22);
      }
      .icon svg {
        display: block;
        width: 92px;
        height: 92px;
      }
      h1 {
        margin: 36px 0 0;
        font-family: Georgia, 'Times New Roman', serif;
        font-weight: 500;
        font-size: 88px;
        line-height: 1;
        letter-spacing: -0.02em;
      }
      .tagline {
        margin: 40px 0 0;
        font-family: Georgia, 'Times New Roman', serif;
        font-size: 44px;
        line-height: 1.3;
        color: var(--accent);
      }
      ul {
        margin: 40px 0 0;
        padding: 0;
        list-style: none;
        font-size: 22px;
        line-height: 1.7;
        color: var(--muted);
      }
      .footer {
        position: absolute;
        left: 90px;
        bottom: 72px;
        font-size: 17px;
        color: var(--soft);
      }
      .frame {
        position: absolute;
        left: 602px;
        top: 197px;
        width: 936px;
        padding: 8px;
        border-radius: 22px;
        background: #fff;
        border: 1px solid rgba(23, 38, 60, 0.12);
        box-shadow: 0 30px 60px rgba(23, 38, 60, 0.22);
      }
      .frame img {
        display: block;
        width: 920px;
        height: 575px;
        border-radius: 15px;
      }
    </style>
  </head>
  <body>
    <div class="eyebrow">Git history in Orca</div>
    <div class="copy">
      <div class="icon">{{ICON}}</div>
      <h1>Git Logs</h1>
      <p class="tagline">Your whole history,<br />one panel away.</p>
      <ul>
        <li>See tags, branches, and authors at a glance.</li>
        <li>Compare any two points in history.</li>
        <li>Follow a single file back in time.</li>
      </ul>
    </div>
    <div class="footer">Git runs locally, right inside Orca</div>
    <div class="frame"><img alt="" src="{{SHOT}}" /></div>
  </body>
</html>
