name: Validate and promote a plugin

on:
  workflow_call:
    inputs:
      plugin:
        type: string
        default: git-logs
      version:
        required: true
        type: string
      expected_hash:
        type: string
        default: ''
      publish:
        required: true
        type: boolean

jobs:
  promote:
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/main' &&
      github.repository == 'tienne/orca-plugins' &&
      vars.ORCA_RELEASE_ENABLED == 'true'
    runs-on: macos-15
    environment: ${{ inputs.publish && 'production' || 'release-preview' }}
    timeout-minutes: 15
    env:
      CI: 'true'
      NX_DAEMON: 'false'
      ORCA_RELEASE_INTEGRATION: '1'
      RELEASE_EXPECTED_HASH: ${{ inputs.expected_hash }}
      RELEASE_MODE: ${{ inputs.publish && 'publish' || 'preview' }}
      RELEASE_PLUGIN: ${{ inputs.plugin }}
      RELEASE_VERSION: ${{ inputs.version }}
      RELEASE_SOURCE_SHA: ${{ github.sha }}
      RELEASE_REPOSITORY: https://github.com/${{ github.repository }}.git
    steps:
      - name: Set release report path
        run: echo "RELEASE_REPORT=$RUNNER_TEMP/release-plan.json" >> "$GITHUB_ENV"
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Check requested version
        run: |
          node --input-type=module <<'JS'
          import { readFileSync } from 'node:fs';
          const plugin = process.env.RELEASE_PLUGIN;
          if (!['git-logs', 'landmark-island'].includes(plugin)) throw new Error('Unsupported release plugin.');
          const manifest = JSON.parse(readFileSync(`plugins/${plugin === 'landmark-island' ? 'orcatopia' : plugin}/orca-plugin.json`, 'utf8'));
          if (!/^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)$/.test(process.env.RELEASE_VERSION) || manifest.version !== process.env.RELEASE_VERSION) {
            throw new Error('Commit the requested stable manifest version to main first.');
          }
          JS
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Prepare pinned Orca CLI
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/release/setup-orca-macos.sh
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ${{ inputs.plugin }}-${{ github.sha }}
          path: dist/plugins/${{ inputs.plugin }}/
      - name: Verify Orca CLI and run release integration tests
        run: |
          "$ORCA_CLI_COMMAND" --version
          pnpm nx run "$RELEASE_PLUGIN:release-test" --output-style=static
      - name: Fetch the current release base
        run: |
          if git ls-remote --exit-code --heads origin release > "$RUNNER_TEMP/release-ref.txt"; then
            git fetch --no-tags origin refs/heads/release:refs/remotes/origin/release
          else
            status=$?
            if [ "$status" -ne 2 ]; then exit "$status"; fi
          fi
      - name: Prepare and validate the candidate
        run: pnpm nx run "$RELEASE_PLUGIN:release-prepare" --output-style=static
      - name: Summarize candidate
        run: |
          node --input-type=module <<'JS'
          import { readFileSync, appendFileSync } from 'node:fs';
          const plan = JSON.parse(readFileSync(process.env.RELEASE_REPORT, 'utf8'));
          appendFileSync(process.env.GITHUB_STEP_SUMMARY, [
            '## ' + plan.pluginKey + ' release candidate',
            '',
            '- Version: ' + plan.version,
            `- Source: ${plan.sourceCommit}`,
            `- Artifact: ${plan.artifactCommit}`,
            `- Catalog: ${plan.catalogCommit}`,
            `- Content hash: ${plan.contentHash}`,
            '',
            'The catalog pins the artifact commit. A preview never pushes refs.',
            '',
          ].join('\n'));
          JS
      - name: Recheck release configuration
        env:
          GH_TOKEN: ${{ github.token }}
          ORCA_RELEASE_ENABLED: ${{ vars.ORCA_RELEASE_ENABLED }}
        run: pnpm nx run "$RELEASE_PLUGIN:release-preflight" --mode="$RELEASE_MODE" --workflow
      - name: Publish branch and source tag
        if: inputs.publish
        env:
          RELEASE_PLAN: ${{ runner.temp }}/release-plan.json
        run: pnpm nx run "$RELEASE_PLUGIN:release-publish" --output-style=static
      - name: Save release plan
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-plan-${{ github.sha }}
          path: ${{ runner.temp }}/release-plan*.json
          if-no-files-found: ignore
          retention-days: 14
